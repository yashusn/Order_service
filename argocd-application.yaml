# ── Production overrides ──────────────────────────────────────────────────────
replicaCount: 3

image:
  repository: 123456789.dkr.ecr.us-east-1.amazonaws.com/order-service
  tag: ""  # Injected by CI

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  hosts:
    - host: api.company.com
      paths:
        - path: /api/v1/orders
          pathType: Prefix

env:
  - name: ENVIRONMENT
    value: "production"
  - name: LOG_LEVEL
    value: "WARN"
  - name: DB_URL
    valueFrom:
      secretKeyRef:
        name: order-service-db-prod
        key: url
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: order-service-db-prod
        key: username
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: order-service-db-prod
        key: password
  - name: REDIS_HOST
    value: "redis-prod-service"
