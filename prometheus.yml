# ── Default values (overridden per environment) ──────────────────────────────

replicaCount: 1

image:
  repository: REPLACE_WITH_ECR_URI/order-service
  pullPolicy: IfNotPresent
  tag: ""  # Injected by CI pipeline

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations:
    # IRSA — grants S3/SQS access without static credentials
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/order-service-sa"
  name: "order-service-sa"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: api-dev.company.com
      paths:
        - path: /api/v1/orders
          pathType: Prefix
  tls:
    - secretName: order-service-tls
      hosts:
        - api-dev.company.com

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 5

env:
  - name: ENVIRONMENT
    value: "local"
  - name: DB_URL
    valueFrom:
      secretKeyRef:
        name: order-service-db
        key: url
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: order-service-db
        key: username
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: order-service-db
        key: password
  - name: REDIS_HOST
    value: "redis-service"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/actuator/prometheus"
  prometheus.io/port: "8080"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
          topologyKey: kubernetes.io/hostname
